<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210"
     role="img" aria-labelledby="t d"
     font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">The age chip at three magnitudes, and its absence</title>
  <desc id="d">Four panel rows sharing one reserved slot width. A live vehicle carries no chip at all. A stale vehicle carries seconds, then minutes and seconds, then whole minutes, capped at one hour plus. The slot is the same width in every row, so the chip's arrival and growth never shift the row.</desc>

  <!-- Hand-written. The dashed outline marks the reserved slot: it is not drawn on screen, it
       is here to show the slot is the same width in all four rows, including the one with
       nothing in it. That is the whole point of the drawing.

       Presentation is in attributes rather than a <style> block on purpose — see the note in
       states.svg. GitHub strips <style> when it renders an SVG inside a document. -->

  <rect x="0" y="0" width="760" height="210" fill="#0d131b"/>

  <g font-size="11" font-weight="600" fill="#6f8294" letter-spacing="0.9">
    <text x="28" y="26">VEHICLE</text>
    <text x="150" y="26">RESERVED SLOT</text>
    <text x="330" y="26">RULE</text>
  </g>

  <!-- live — no chip, and the slot is still there -->
  <g transform="translate(0,44)">
    <path d="M 34,20 L 42,4 L 34,8 L 26,4 Z" fill="#eef3f8" transform="rotate(180 34 12)"/>
    <text x="56" y="17" font-size="13" font-weight="600" fill="#93a6b8"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">UAV-01</text>
    <rect x="150" y="1" width="94" height="24" rx="4" fill="none"
          stroke="#2c3d4e" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="330" y="17" font-size="12" fill="#93a6b8">live &#8212; no chip at all, not even a dash</text>
  </g>

  <!-- under a minute -->
  <g transform="translate(0,80)">
    <path d="M 34,20 L 42,4 L 34,8 L 26,4 Z" fill="none" stroke="#e8a33d" stroke-width="1.75"
          stroke-linejoin="round" transform="rotate(180 34 12)"/>
    <text x="56" y="17" font-size="13" font-weight="600" fill="#93a6b8"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">UAV-03</text>
    <rect x="150" y="1" width="94" height="24" rx="4" fill="none"
          stroke="#2c3d4e" stroke-width="1" stroke-dasharray="3 3"/>
    <rect x="194" y="2" width="44" height="22" rx="4" fill="#080c12"
          stroke="#e8a33d" stroke-width="1.25"/>
    <text x="232" y="17.5" text-anchor="end" font-size="13" font-weight="600" fill="#e8a33d"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">7s</text>
    <text x="330" y="17" font-size="12" fill="#6f8294">under a minute &#8212; seconds, no padding</text>
  </g>

  <!-- under ten minutes -->
  <g transform="translate(0,116)">
    <path d="M 34,20 L 42,4 L 34,8 L 26,4 Z" fill="none" stroke="#e8a33d" stroke-width="1.75"
          stroke-linejoin="round" transform="rotate(180 34 12)"/>
    <text x="56" y="17" font-size="13" font-weight="600" fill="#93a6b8"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">UAV-03</text>
    <rect x="150" y="1" width="94" height="24" rx="4" fill="none"
          stroke="#2c3d4e" stroke-width="1" stroke-dasharray="3 3"/>
    <rect x="156" y="2" width="82" height="22" rx="4" fill="#080c12"
          stroke="#e8a33d" stroke-width="1.25"/>
    <text x="232" y="17.5" text-anchor="end" font-size="13" font-weight="600" fill="#e8a33d"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1m 20s</text>
    <text x="330" y="17" font-size="12" fill="#6f8294">under ten minutes &#8212; the seconds still matter</text>
  </g>

  <!-- beyond, and the cap -->
  <g transform="translate(0,152)">
    <circle cx="34" cy="12" r="9" fill="none" stroke="#6f8294" stroke-width="1.75"
            stroke-dasharray="4 3"/>
    <text x="56" y="17" font-size="13" font-weight="600" fill="#93a6b8"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">UAV-07</text>
    <rect x="150" y="1" width="94" height="24" rx="4" fill="none"
          stroke="#2c3d4e" stroke-width="1" stroke-dasharray="3 3"/>
    <rect x="184" y="2" width="54" height="22" rx="4" fill="#080c12"
          stroke="#6f8294" stroke-width="1.25"/>
    <text x="232" y="17.5" text-anchor="end" font-size="13" font-weight="600" fill="#6f8294"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">12m</text>
    <text x="330" y="17" font-size="12" fill="#6f8294">whole minutes &#8212; then one cap at <tspan
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-weight="600">1h+</tspan>, so the slot never widens</text>
  </g>
</svg>
