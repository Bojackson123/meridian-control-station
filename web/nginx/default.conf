# nginx in front of the console bundle, reverse-proxying /api to the API container.
#
# This file lives under web/ rather than deploy/ because web/ is the build context: the image
# cannot COPY a path outside it. Port 8080 rather than 80 because the base image is
# nginx-unprivileged and does not run as root.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    #  The bundle is dominated by maplibre-gl and compresses to roughly a third of its size.
    #  Named types only, deliberately -- see the /api block, where compressing the response
    #  is not a saving but a bug.
    gzip             on;
    gzip_types       text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;

    location / {
        #  There is one route today. A deep link that 404s is a one-line fix, and this is
        #  the line, bought before the routes that need it exist.
        try_files $uri /index.html;
    }

    #  Vite hashes these filenames, so a changed file is a changed URL and the old one can be
    #  held forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    #  index.html is what names the hashed files, so it is the one thing that must not be
    #  cached: cache it and a rebuilt stack keeps serving the previous console, pointing at
    #  assets that are still present, with nothing on screen to say so.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        #  Docker's embedded DNS, and the api service resolved through a variable rather than
        #  written literally into proxy_pass. The literal form is resolved once at config load,
        #  which means nginx refuses to start at all when the api container is not up yet:
        #  measured, not assumed -- `docker run mcs-web` on its own exits with
        #  "host not found in upstream" instead of serving the console. An image that cannot
        #  run without a sibling container cannot be tested on its own, and under Compose the
        #  same rule turns an api that is slow to appear into a crash loop in front of it.
        #
        #  What this gives up is the startup check: a wrong service name is now a 502 at
        #  request time rather than a refusal to boot. That trade is only acceptable because
        #  proxying is not the whole job here -- the console still loads and says so.
        #
        #  $request_uri rather than letting nginx append the matched path: with a variable in
        #  proxy_pass the URI is not passed through automatically, and the query string is
        #  what goes missing.
        resolver         127.0.0.11 ipv6=off valid=10s;
        resolver_timeout 5s;
        set $mcs_api     "api:8080";
        proxy_pass       http://$mcs_api$request_uri;

        proxy_http_version 1.1;
        #  Clears the hop-by-hop Connection header inherited from the client request, so
        #  nginx keeps the upstream connection alive on its own terms rather than the
        #  browser's.
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        #  These four are what keep /api/telemetry/stream working through the proxy. nginx
        #  buffers a proxied response by default, and a buffered stream of server-sent events
        #  reaches the console in bursts or not at all -- a symptom that points straight at
        #  the API, which is fine, and costs an hour before anyone suspects the proxy.
        #
        #  The API also sends X-Accel-Buffering: no, which nginx honours and which would be
        #  enough on its own. Both are here on purpose: one lives in the application and one
        #  in the deployment, so the property survives either being changed by someone who
        #  did not know about the other.
        proxy_buffering           off;
        proxy_cache               off;
        gzip                      off;
        chunked_transfer_encoding off;

        #  Default is 60 seconds and the stream's heartbeat is 15, so a healthy connection
        #  saying exactly what it is supposed to say gets killed every minute on the minute.
        #  An hour is well past any interval the station has a reason to be silent for.
        proxy_read_timeout 1h;
    }
}
